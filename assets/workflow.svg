<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Gradients for Nodes -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff0055"/><stop offset="100%" stop-color="#ff0000"/></linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff5500"/><stop offset="100%" stop-color="#ff3300"/></linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffaa00"/><stop offset="100%" stop-color="#ff8800"/></linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ddcc00"/><stop offset="100%" stop-color="#bbbb00"/></linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#88dd00"/><stop offset="100%" stop-color="#55cc00"/></linearGradient>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00dd55"/><stop offset="100%" stop-color="#00aa33"/></linearGradient>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00ddaa"/><stop offset="100%" stop-color="#00aa88"/></linearGradient>
    <linearGradient id="grad8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00aadd"/><stop offset="100%" stop-color="#0088cc"/></linearGradient>
    <linearGradient id="grad9" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0055ff"/><stop offset="100%" stop-color="#0000ff"/></linearGradient>
    <linearGradient id="grad10" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5500ff"/><stop offset="100%" stop-color="#3300dd"/></linearGradient>
    <linearGradient id="grad11" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#aa00ff"/><stop offset="100%" stop-color="#8800dd"/></linearGradient>
    <linearGradient id="grad12" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff00ff"/><stop offset="100%" stop-color="#dd00dd"/></linearGradient>
    <linearGradient id="grad13" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff00aa"/><stop offset="100%" stop-color="#dd0088"/></linearGradient>
    <linearGradient id="grad14" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff5588"/><stop offset="100%" stop-color="#ff3366"/></linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117" rx="15" />
  
  <g font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">
    <path d="M 100,100 L 280,100 L 460,100 L 640,100 L 820,100 Q 820,300 820,300 L 640,300 L 460,300 L 280,300 L 100,300 Q 100,500 100,500 L 280,500 L 460,500 L 640,500 " fill="none" stroke="#444C56" stroke-width="6" />
    <path d="M 100,100 L 280,100 L 460,100 L 640,100 L 820,100 Q 820,300 820,300 L 640,300 L 460,300 L 280,300 L 100,300 Q 100,500 100,500 L 280,500 L 460,500 L 640,500 " fill="none" stroke="#58a6ff" stroke-width="4" stroke-dasharray="15, 15">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1s" repeatCount="indefinite" />
    </path>

    <g transform="translate(100,100)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad1)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">INPUT / DATA</text>
    </g>
    
    <g transform="translate(280,100)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad2)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">DATA COLLECTION</text>
    </g>
    
    <g transform="translate(460,100)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad3)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">DATASET</text>
    </g>
    
    <g transform="translate(640,100)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad4)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">DATA PREPROC.</text>
    </g>
    
    <g transform="translate(820,100)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad5)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">FEATURE ENG.</text>
    </g>
    
    <g transform="translate(820,300)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad6)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">MODEL TRAINING</text>
    </g>
    
    <g transform="translate(640,300)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad7)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">MODEL EVAL.</text>
    </g>
    
    <g transform="translate(460,300)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad8)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">AI INFERENCE</text>
    </g>
    
    <g transform="translate(280,300)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad9)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">GUARDRAILS</text>
    </g>
    
    <g transform="translate(100,300)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad10)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">DECISION ENGINE</text>
    </g>
    
    <g transform="translate(100,500)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad11)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">RECOMMENDATION</text>
    </g>
    
    <g transform="translate(280,500)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad12)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">API / BACKEND</text>
    </g>
    
    <g transform="translate(460,500)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad13)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">DASHBOARD</text>
    </g>
    
    <g transform="translate(640,500)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="url(#grad14)" filter="url(#glow)"/>
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
      <text y="5">AUDIT LOG</text>
    </g>
    
  </g>
</svg>
