<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">RecoverAI — Payment Recovery Workflow</title>
  <desc id="wf-desc">Six-stage 3D isometric pipeline: Failed Payment → Validation → Guardrails → Decision Engine → Operator Action → Audit Trail</desc>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f18"/>
      <stop offset="100%" stop-color="#0f2e22"/>
    </linearGradient>

    <!-- Block top face gradients -->
    <linearGradient id="redTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#cc3a3a"/>
    </linearGradient>
    <linearGradient id="amberTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcc55"/>
      <stop offset="100%" stop-color="#e09500"/>
    </linearGradient>
    <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7eb9ff"/>
      <stop offset="100%" stop-color="#3a7fe0"/>
    </linearGradient>
    <linearGradient id="purpleTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c987ff"/>
      <stop offset="100%" stop-color="#8b3fd4"/>
    </linearGradient>
    <linearGradient id="mintTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5af0a8"/>
      <stop offset="100%" stop-color="#1db870"/>
    </linearGradient>
    <linearGradient id="tealTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38e8e0"/>
      <stop offset="100%" stop-color="#0a9e98"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#010e08" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="780" fill="url(#bgGrad)" rx="24"/>

  <!-- Grid lines for depth feel -->
  <g opacity=".08" stroke="#5af0a8" stroke-width="1">
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="350" x2="1500" y2="350"/>
    <line x1="0" y1="500" x2="1500" y2="500"/>
    <line x1="0" y1="650" x2="1500" y2="650"/>
    <line x1="200" y1="0" x2="200" y2="780"/>
    <line x1="450" y1="0" x2="450" y2="780"/>
    <line x1="700" y1="0" x2="700" y2="780"/>
    <line x1="950" y1="0" x2="950" y2="780"/>
    <line x1="1200" y1="0" x2="1200" y2="780"/>
    <line x1="1450" y1="0" x2="1450" y2="780"/>
  </g>

  <!-- Diagonal accent lines -->
  <g opacity=".06" stroke="#5af0a8" stroke-width="1.5">
    <line x1="0" y1="650" x2="1500" y2="100"/>
    <line x1="0" y1="780" x2="1500" y2="230"/>
    <line x1="0" y1="520" x2="1500" y2="-30"/>
  </g>

  <!-- Header -->
  <text x="60" y="72" fill="#eafff4" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1">RecoverAI</text>
  <text x="60" y="108" fill="#4fcf90" font-family="'Segoe UI', Arial, sans-serif" font-size="18">Payment Recovery Pipeline — End-to-End Workflow</text>

  <!-- Step number indicator strip -->
  <rect x="60" y="128" width="1380" height="2" fill="#1e5e40" rx="1"/>

  <!-- ============================================================
       ISOMETRIC BLOCKS — 6 stages
       Block width=200 height=110 (isometric top face)
       Gap between blocks = 50 (connector)
       Starting x=60, y centers around 390
  ============================================================ -->

  <!-- Helper: Isometric box macro
       Top face: parallelogram; left face: darker; right face: darkest -->

  <!-- === STAGE 1: FAILED PAYMENT (Red) === -->
  <g filter="url(#shadow)" transform="translate(60,260)">
    <!-- Top face -->
    <path d="M100,0 L220,60 L220,60 L100,120 L-20,60 Z" fill="url(#redTop)"/>
    <!-- Left face -->
    <path d="M-20,60 L100,120 L100,270 L-20,210 Z" fill="#7a1a1a"/>
    <!-- Right face -->
    <path d="M220,60 L100,120 L100,270 L220,210 Z" fill="#9e2222"/>
    <!-- Icon: X mark for failed -->
    <g transform="translate(100,55)">
      <circle r="28" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="2.5"/>
      <line x1="-13" y1="-13" x2="13" y2="13" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <line x1="13" y1="-13" x2="-13" y2="13" stroke="white" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Label on front face -->
    <text x="100" y="185" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">FAILED</text>
    <text x="100" y="205" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">PAYMENT</text>
    <text x="100" y="235" text-anchor="middle" fill="#ffaaaa" font-family="'Segoe UI',Arial" font-size="12">Razorpay event</text>
  </g>

  <!-- Connector arrow 1→2 -->
  <g opacity=".9">
    <line x1="282" y1="390" x2="330" y2="390" stroke="#5af0a8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="330,383 344,390 330,397" fill="#5af0a8"/>
  </g>

  <!-- === STAGE 2: VALIDATION (Amber) === -->
  <g filter="url(#shadow)" transform="translate(344,260)">
    <path d="M100,0 L220,60 L220,60 L100,120 L-20,60 Z" fill="url(#amberTop)"/>
    <path d="M-20,60 L100,120 L100,270 L-20,210 Z" fill="#7a5000"/>
    <path d="M220,60 L100,120 L100,270 L220,210 Z" fill="#9e6800"/>
    <!-- Icon: checkmark/clipboard -->
    <g transform="translate(100,55)">
      <rect x="-20" y="-24" width="40" height="48" rx="5" fill="rgba(255,255,255,0.18)" stroke="white" stroke-width="2.5"/>
      <line x1="-11" y1="2" x2="11" y2="2" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <line x1="-11" y1="10" x2="5" y2="10" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <line x1="-8" y1="-10" x2="0" y2="-2" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-2" x2="12" y2="-16" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="100" y="185" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">INPUT</text>
    <text x="100" y="205" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">VALIDATION</text>
    <text x="100" y="235" text-anchor="middle" fill="#ffe4a0" font-family="'Segoe UI',Arial" font-size="12">Schema + range checks</text>
  </g>

  <!-- Connector arrow 2→3 -->
  <g opacity=".9">
    <line x1="566" y1="390" x2="614" y2="390" stroke="#5af0a8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="614,383 628,390 614,397" fill="#5af0a8"/>
  </g>

  <!-- === STAGE 3: GUARDRAILS (Blue) === -->
  <g filter="url(#shadow)" transform="translate(628,260)">
    <path d="M100,0 L220,60 L220,60 L100,120 L-20,60 Z" fill="url(#blueTop)"/>
    <path d="M-20,60 L100,120 L100,270 L-20,210 Z" fill="#1a3e7a"/>
    <path d="M220,60 L100,120 L100,270 L220,210 Z" fill="#22509e"/>
    <!-- Icon: shield -->
    <g transform="translate(100,55)">
      <path d="M0,-28 L24,-14 L24,10 C24,26 0,36 0,36 C0,36 -24,26 -24,10 L-24,-14 Z" fill="rgba(255,255,255,0.18)" stroke="white" stroke-width="2.5"/>
      <path d="-10,4 L-3,12 L12,-8" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="100" y="185" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">GUARDRAILS</text>
    <text x="100" y="205" text-anchor="middle" fill="#dae8ff" font-family="'Segoe UI',Arial" font-size="12">Consent · Risk · Limits</text>
    <text x="100" y="225" text-anchor="middle" fill="#dae8ff" font-family="'Segoe UI',Arial" font-size="12">Retry count checks</text>
  </g>

  <!-- Connector arrow 3→4 -->
  <g opacity=".9">
    <line x1="850" y1="390" x2="898" y2="390" stroke="#5af0a8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="898,383 912,390 898,397" fill="#5af0a8"/>
  </g>

  <!-- === STAGE 4: DECISION ENGINE (Purple) === -->
  <g filter="url(#shadow)" transform="translate(912,260)">
    <path d="M100,0 L220,60 L220,60 L100,120 L-20,60 Z" fill="url(#purpleTop)"/>
    <path d="M-20,60 L100,120 L100,270 L-20,210 Z" fill="#3e1a7a"/>
    <path d="M220,60 L100,120 L100,270 L220,210 Z" fill="#50229e"/>
    <!-- Icon: bar chart/scoring -->
    <g transform="translate(100,55)">
      <rect x="-22" y="0" width="10" height="22" rx="2" fill="rgba(255,255,255,0.7)"/>
      <rect x="-8" y="-14" width="10" height="36" rx="2" fill="rgba(255,255,255,0.9)"/>
      <rect x="6" y="-8" width="10" height="30" rx="2" fill="rgba(255,255,255,0.6)"/>
      <rect x="20" y="-20" width="10" height="42" rx="2" fill="rgba(255,255,255,1)"/>
    </g>
    <text x="100" y="185" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">DECISION</text>
    <text x="100" y="205" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">ENGINE</text>
    <text x="100" y="235" text-anchor="middle" fill="#e2c8ff" font-family="'Segoe UI',Arial" font-size="12">Policy scoring + ranking</text>
  </g>

  <!-- Connector arrow 4→5 -->
  <g opacity=".9">
    <line x1="1134" y1="390" x2="1182" y2="390" stroke="#5af0a8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="1182,383 1196,390 1182,397" fill="#5af0a8"/>
  </g>

  <!-- === STAGE 5: OPERATOR ACTION (Mint) === -->
  <g filter="url(#shadow)" transform="translate(1196,260)">
    <path d="M100,0 L220,60 L220,60 L100,120 L-20,60 Z" fill="url(#mintTop)"/>
    <path d="M-20,60 L100,120 L100,270 L-20,210 Z" fill="#0b5e38"/>
    <path d="M220,60 L100,120 L100,270 L220,210 Z" fill="#0e7848"/>
    <!-- Icon: person/operator -->
    <g transform="translate(100,55)">
      <circle cx="0" cy="-16" r="13" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2.5"/>
      <path d="M-22,22 C-22,6 22,6 22,22" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="100" y="185" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">OPERATOR</text>
    <text x="100" y="205" text-anchor="middle" fill="#fff" font-family="'Segoe UI',Arial" font-size="16" font-weight="700">ACTION</text>
    <text x="100" y="235" text-anchor="middle" fill="#b8f5d8" font-family="'Segoe UI',Arial" font-size="12">Approve · Execute · Link</text>
  </g>

  <!-- === AUDIT TRAIL — bottom center banner === -->
  <g transform="translate(520,590)">
    <rect x="0" y="0" width="460" height="70" rx="12" fill="#0d3d28" stroke="#2ef098" stroke-width="1.5" opacity=".9"/>
    <!-- Teal accent left -->
    <rect x="0" y="0" width="6" height="70" rx="3" fill="url(#tealTop)"/>
    <!-- Icon: lock/database -->
    <g transform="translate(38,35)">
      <rect x="-14" y="-8" width="28" height="20" rx="4" fill="none" stroke="#38e8e0" stroke-width="2.5"/>
      <path d="M-7,-8 A7,7 0 0,1 7,-8" fill="none" stroke="#38e8e0" stroke-width="2.5"/>
      <circle cx="0" cy="6" r="3" fill="#38e8e0"/>
    </g>
    <text x="68" y="27" fill="#eafff8" font-family="'Segoe UI',Arial" font-size="15" font-weight="700">AUDIT TRAIL</text>
    <text x="68" y="48" fill="#88c9b0" font-family="'Segoe UI',Arial" font-size="12">Every event, decision &amp; execution stored in SQLite · Privacy-safe · Idempotent</text>
  </g>

  <!-- Curved connector from Stage 5 bottom to Audit Trail -->
  <path d="M1296,530 C1296,580 980,580 980,600" fill="none" stroke="#2ef098" stroke-width="2" stroke-dasharray="6,4" opacity=".6"/>

  <!-- Curved connector from Stage 1 bottom to Audit Trail -->
  <path d="M160,530 C160,580 520,580 520,600" fill="none" stroke="#2ef098" stroke-width="2" stroke-dasharray="6,4" opacity=".6"/>

  <!-- Stage number badges -->
  <g font-family="'Segoe UI',Arial" font-size="11" font-weight="700">
    <circle cx="112" cy="265" r="13" fill="#cc3a3a" opacity=".9"/>
    <text x="112" y="270" text-anchor="middle" fill="white">01</text>
    <circle cx="396" cy="265" r="13" fill="#e09500" opacity=".9"/>
    <text x="396" y="270" text-anchor="middle" fill="white">02</text>
    <circle cx="680" cy="265" r="13" fill="#3a7fe0" opacity=".9"/>
    <text x="680" y="270" text-anchor="middle" fill="white">03</text>
    <circle cx="964" cy="265" r="13" fill="#8b3fd4" opacity=".9"/>
    <text x="964" y="270" text-anchor="middle" fill="white">04</text>
    <circle cx="1248" cy="265" r="13" fill="#1db870" opacity=".9"/>
    <text x="1248" y="270" text-anchor="middle" fill="white">05</text>
  </g>

  <!-- Footer legend -->
  <g font-family="'Segoe UI',Arial" font-size="13" fill="#4a8a6a">
    <text x="60" y="748">● Each stage is independently testable and replaceable in production</text>
    <text x="900" y="748">Razorpay Payment Recovery System</text>
  </g>
</svg>
