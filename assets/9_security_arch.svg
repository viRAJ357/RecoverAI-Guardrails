<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs><rect width="900" height="580" fill="#090a0f" rx="16"/>
<text x="450" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">SECURITY ARCHITECTURE</text><rect x="40" y="70" width="820" height="460" rx="16" fill="none" stroke="#00ffcc" stroke-width="3" stroke-dasharray="18,10" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></rect><text x="450" y="100" font-family="Consolas,monospace" font-size="16" font-weight="bold" fill="#00ffcc" text-anchor="middle">SECURITY BOUNDARY</text><rect x="70" y="130" width="760" height="124" rx="10" fill="#00ccff" fill-opacity="0.08" stroke="#00ccff" stroke-width="2" filter="url(#glow)"/><text x="450" y="154" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#00ccff" text-anchor="middle">INPUT VALIDATION (Pydantic)</text><text x="110" y="180" font-family="Consolas,monospace" font-size="13" fill="#00ccff">• Type checking on all 26 fields</text><text x="110" y="208" font-family="Consolas,monospace" font-size="13" fill="#00ccff">• Range validation (risk_score 0-100)</text><text x="110" y="236" font-family="Consolas,monospace" font-size="13" fill="#00ccff">• Required field enforcement</text><rect x="70" y="274" width="760" height="124" rx="10" fill="#ff8800" fill-opacity="0.08" stroke="#ff8800" stroke-width="2" filter="url(#glow)"/><text x="450" y="298" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#ff8800" text-anchor="middle">GUARDRAILS LAYER</text><text x="110" y="324" font-family="Consolas,monospace" font-size="13" fill="#ff8800">• Hard-coded financial rules — 5 rules</text><text x="110" y="352" font-family="Consolas,monospace" font-size="13" fill="#ff8800">• Cannot be overridden by ML model</text><text x="110" y="380" font-family="Consolas,monospace" font-size="13" fill="#ff8800">• Prevents model hallucination</text><rect x="70" y="418" width="760" height="96" rx="10" fill="#aaff00" fill-opacity="0.08" stroke="#aaff00" stroke-width="2" filter="url(#glow)"/><text x="450" y="442" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#aaff00" text-anchor="middle">CORS MIDDLEWARE</text><text x="110" y="468" font-family="Consolas,monospace" font-size="13" fill="#aaff00">• Configurable origin control</text><text x="110" y="496" font-family="Consolas,monospace" font-size="13" fill="#aaff00">• FastAPI built-in CORS handler</text></svg>